max_rollout_retries: 2
scene_provider:
  kind: usdz
  usdz:
    artifact_cache_size: 10
    data_dir: <repo>/data/nre-artifacts/scenesets/cf2d2c6211d5c92a4fd06f6c7ba72fcb
  trajdata:
    cache_location: trajdata_cache
    desired_dt: 0.1
    load_vector_map: true
    rebuild_cache: false
    rebuild_maps: false
    num_workers: 4
    dataset:
      extra_params:
        num_timesteps_before: 30
        num_timesteps_after: 80
smooth_trajectories: true
endpoints:
  sensorsim_cache_size: '5'
  renderer:
    n_concurrent_rollouts: 4
    skip: false
  controller:
    skip: false
    n_concurrent_rollouts: 4
  driver:
    n_concurrent_rollouts: 4
  physics:
    n_concurrent_rollouts: 4
    skip: false
  trafficsim:
    n_concurrent_rollouts: 4
    skip: true
renderer:
  kind: sensorsim
enable_autoresume: false
nr_workers: 1
simulation_config:
  n_sim_steps: 200
  n_rollouts: 1
  force_gt_duration_us: 1700000
  skip_driver_during_force_gt: true
  force_gt_frame_cache:
    enabled: false
    cache_dir: <repo>/data/nre-artifacts/force_gt_frame_cache
  send_recording_ground_truth: false
  render_bundling: BATCH_RENDER_RGB
  control_timestep_us: 100000
  pose_reporting_interval_us: 0
  ego_mask_rig_config_id: hyperion_8_1
  planner_delay_us: 0
  min_traffic_duration_us: 3000000
  assert_zero_decision_delay: true
  physics_update_mode: EGO_ONLY
  route_generator_type: NONE
  route_start_offset_m: 0.0
  cameras:
    - logical_id: camera_cross_left_120fov
      height: 1080
      width: 1900
      frame_interval_us: 100000
      shutter_duration_us: 30000
    - logical_id: camera_front_wide_120fov
      height: 1080
      width: 1900
      frame_interval_us: 100000
      shutter_duration_us: 30000
    - logical_id: camera_cross_right_120fov
      height: 1080
      width: 1900
      frame_interval_us: 100000
      shutter_duration_us: 30000
    - logical_id: camera_front_tele_30fov
      height: 1080
      width: 1900
      frame_interval_us: 100000
      shutter_duration_us: 30000
  render_lidar_for_driver: true
  radars:
    - name: front_long_range
      rig_to_radar:
        translation_m:
          - 4.0
          - 0.0
          - 0.5
        rotation_xyzw:
          - 0.0
          - 0.0
          - 0.0
          - 1.0
      max_range_m: 200.0
      half_fov_deg: 9.0
      azimuth_noise_deg: 0.1
      detection_probability: 0.9
      false_alarms_per_scan: 1.5
    - name: front_mid_range
      rig_to_radar:
        translation_m:
          - 4.0
          - 0.0
          - 0.5
        rotation_xyzw:
          - 0.0
          - 0.0
          - 0.0
          - 1.0
      max_range_m: 70.0
      half_fov_deg: 45.0
      azimuth_noise_deg: 0.5
      detection_probability: 0.9
      false_alarms_per_scan: 1.5
prometheus:
  worker_ports:
    - 6000
  url: http://localhost:6001
scenes:
  - scene_id: clipgt-05e74bef-0afa-468e-b679-b7f14079be30
  - scene_id: clipgt-05f35348-9de0-4f68-ac65-f31316dbb59e
  - scene_id: clipgt-096988dd-9367-4fdf-84f9-5a73c5061c6e
  - scene_id: clipgt-0d1fcd2c-ed47-4c72-b756-8e24bce0b9f4
  - scene_id: clipgt-0dbb91dd-8db1-4e10-b155-14fdf46218bc
  - scene_id: clipgt-127c4f85-a5db-4920-9813-7970dcd6ebdb
  - scene_id: clipgt-1a7b81b8-9bca-4385-a591-64f74eb59db2
  - scene_id: clipgt-1d0d601f-bba0-423a-8f3f-8942bb529fd7
  - scene_id: clipgt-20a057e5-c79e-4e78-934e-754a8de365b2
  - scene_id: clipgt-22f1e835-c0b2-468f-9385-e893f22d1e6c
  - scene_id: clipgt-307a1b77-7fce-4427-8175-4ac14d0147d2
