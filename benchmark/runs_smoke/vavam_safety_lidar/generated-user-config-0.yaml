max_rollout_retries: 2
scene_provider:
  kind: usdz
  usdz:
    artifact_cache_size: 10
    data_dir: <repo>/data/nre-artifacts/scenesets/1f6a5bc4667e7124cbdb2565d0d42d0e
  trajdata:
    cache_location: trajdata_cache
    desired_dt: 0.1
    load_vector_map: true
    rebuild_cache: false
    rebuild_maps: false
    num_workers: 4
    dataset:
      extra_params:
        num_timesteps_before: 30
        num_timesteps_after: 80
smooth_trajectories: true
endpoints:
  sensorsim_cache_size: '5'
  renderer:
    n_concurrent_rollouts: 4
    skip: false
  controller:
    skip: false
    n_concurrent_rollouts: 4
  driver:
    n_concurrent_rollouts: 4
  physics:
    n_concurrent_rollouts: 4
    skip: false
  trafficsim:
    n_concurrent_rollouts: 4
    skip: true
renderer:
  kind: sensorsim
enable_autoresume: false
extra_cameras:
  - logical_id: camera_front_wide_120fov
    rig_to_camera:
      translation_m:
        - 1.65897811
        - -0.01443456
        - 1.51539499
      rotation_xyzw:
        - -0.49929397355810856
        - 0.5039939168301356
        - -0.4972939976976715
        - 0.49939397235113037
    intrinsics:
      model: opencv_pinhole
      opencv_pinhole:
        focal_length:
          - 1545.0
          - 1545.0
        principal_point:
          - 960.0
          - 560.0
        radial:
          - -0.356123
          - 0.172545
          - -0.05231
          - 0.0
          - 0.0
          - 0.0
        tangential:
          - -0.00213
          - 0.000464
        thin_prism:
          - 0.0
          - 0.0
          - 0.0
          - 0.0
    resolution_hw:
      - 1080
      - 1920
    shutter_type: ROLLING_TOP_TO_BOTTOM
nr_workers: 1
simulation_config:
  n_sim_steps: 40
  n_rollouts: 1
  force_gt_duration_us: 3000000
  skip_driver_during_force_gt: false
  force_gt_frame_cache:
    enabled: false
    cache_dir: <repo>/data/nre-artifacts/force_gt_frame_cache
  send_recording_ground_truth: false
  render_bundling: BATCH_RENDER_RGB
  control_timestep_us: 500000
  pose_reporting_interval_us: 0
  planner_delay_us: 0
  min_traffic_duration_us: 3000000
  assert_zero_decision_delay: true
  physics_update_mode: EGO_ONLY
  route_generator_type: MAP
  route_start_offset_m: 0.0
  cameras:
    - height: 1080
      width: 1920
      logical_id: camera_front_wide_120fov
      frame_interval_us: 500000
      shutter_duration_us: 30000
  render_lidar_for_driver: true
prometheus:
  worker_ports:
    - 6000
  url: http://localhost:6001
scenes:
  - scene_id: clipgt-02eadd92-02f1-46d8-86fe-a9e338fed0b6
